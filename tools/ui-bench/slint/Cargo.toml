[package]
name = "challenger-native-bench"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
