[package]
name = "challenger-slint-rust-host"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
webbrowser = "1.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
