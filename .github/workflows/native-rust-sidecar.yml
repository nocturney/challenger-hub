name: Native Rust / Slint + read-only Node sidecar
on:
  pull_request:
    paths:
      - ".github/workflows/native-rust-sidecar.yml"
      - ".gitattributes"
      - "tools/ui-bench/slint-rust-host/**"
      - "tools/ui-bench/slint-node-bridge/main.slint"
      - "tools/ui-bench/slint-node-bridge/sidecar.mjs"
      - "tools/ui-bench/slint-node-bridge/live-catalog.mjs"
      - "tools/ui-bench/slint-node-bridge/bridge.test.mjs"
      - "tools/ui-bench/slint-node-bridge/install-bridge.mjs"
      - "tools/ui-bench/slint-node-bridge/install-bridge.test.mjs"
      - "tools/ui-bench/slint-node-bridge/windows-install-sandbox.ps1"
      - "tools/desktop-build/seeds/managed-catalog.preview10.json"
      - "tools/desktop-build/seeds/catalog-candidates.preview10.json"
  workflow_dispatch:
# A newer PR commit supersedes older CI; manual QA runs are never auto-canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  native-read-only:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate macOS package shell syntax before Rust compilation
        if: runner.os != 'Windows'
        run: bash -n tools/ui-bench/slint-rust-host/package-macos.sh
      - name: Validate Windows package PowerShell syntax before Rust compilation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/ui-bench/slint-rust-host/package-windows.ps1').Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ("Packaging PowerShell syntax: " + (($parseErrors | ForEach-Object { $_.Message }) -join "; ")) }
      - name: Linux native Slint development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev xvfb
      - name: Build reviewed Preview12 test runtime only
        run: node tools/desktop-build/build-runtime.cjs 12
      - name: Validate portable artifact manifest script syntax
        run: node --check tools/ui-bench/slint-rust-host/portable-artifact.mjs
      - name: Verify exact upstream media checksums and source approvals
        run: node tools/ui-bench/slint-rust-host/verify-native-media.mjs
      - name: Rust read-only protocol regression tests
        run: cargo test --manifest-path tools/ui-bench/slint-rust-host/Cargo.toml --locked
      - name: Native bridge plus explicit install-policy security regressions
        run: node --test tools/ui-bench/slint-node-bridge/bridge.test.mjs tools/ui-bench/slint-node-bridge/install-bridge.test.mjs
      - name: Real Node backend / 181-record IPC acceptance
        run: cargo run --manifest-path tools/ui-bench/slint-rust-host/Cargo.toml --locked -- --check-backend-only
      - name: Native OS registration evidence (explicit read, no installation)
        run: cargo run --manifest-path tools/ui-bench/slint-rust-host/Cargo.toml --locked -- --check-device-only
      - name: Reviewed native ID to source project cross-reference
        run: cargo run --manifest-path tools/ui-bench/slint-rust-host/Cargo.toml --locked -- --check-identity-only
      - name: Expired OS observation retains rows but disables links
        if: runner.os != 'Linux'
        run: cargo run --manifest-path tools/ui-bench/slint-rust-host/Cargo.toml --locked -- --qa-verify-stale
      - name: Linux expired observation UI state under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run --manifest-path tools/ui-bench/slint-rust-host/Cargo.toml --locked -- --qa-verify-stale
      - name: macOS developer app packaging and bundled-engine smoke
        if: runner.os == 'macOS'
        run: |
          bash tools/ui-bench/slint-rust-host/package-macos.sh
          app="tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview.app"
          codesign --verify --deep --strict "$app"
          test -f "$app/Contents/Resources/install-bridge.mjs"
          test -s "$app/Contents/Resources/NODE_LICENSE.txt"
          test "$("$app/Contents/Resources/node" --version)" = "v24.22.1"
          node --check "$app/Contents/Resources/install-bridge.mjs"
          "$app/Contents/MacOS/challenger-slint-rust-host" --check-backend-only
          "$app/Contents/MacOS/challenger-slint-rust-host" --check-device-only
          "$app/Contents/MacOS/challenger-slint-rust-host" --check-identity-only
      - name: Windows developer package and bundled-engine smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/ui-bench/slint-rust-host/package-windows.ps1 -DebugBuild
          $bridge = "./tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/resources/install-bridge.mjs"
          if (!(Test-Path $bridge)) { throw "Bundled native installer policy bridge missing" }
          $bundledNode = "./tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/resources/node.exe"
          $nodeLicense = "./tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/resources/NODE_LICENSE.txt"
          if (!(Test-Path $nodeLicense) -or (Get-Item $nodeLicense).Length -lt 150000) { throw "Bundled Node license missing" }
          if ((& $bundledNode --version) -ne "v24.22.1" -or $LASTEXITCODE -ne 0) { throw "Bundled Node version mismatch" }
          & node --check $bridge
          if ($LASTEXITCODE -ne 0) { throw "Bundled install bridge syntax invalid" }
          & ./tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/challenger-slint-rust-host.exe --check-backend-only
          & ./tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/challenger-slint-rust-host.exe --check-device-only
          & ./tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/challenger-slint-rust-host.exe --check-identity-only
      - name: Windows native Slint GUI smoke (GPU-free software renderer)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SLINT_BACKEND: winit-software
        run: |
          & ./tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/challenger-slint-rust-host.exe --smoke
      - name: Windows native resize and compact/expanded navigation QA
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SLINT_BACKEND: winit-software
        run: |
          & ./tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/challenger-slint-rust-host.exe --qa-resize
          if ($LASTEXITCODE -ne 0) { throw "Windows native resize test failed" }
      - name: Real Windows install QA in disposable GitHub runner only
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/ui-bench/slint-node-bridge/windows-install-sandbox.ps1
      - name: Isolated Windows developer QA bundle (24h retention, on request)
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: challenger-native-windows-qa-${{ github.run_id }}
          path: tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/
          retention-days: 1
          if-no-files-found: error
          compression-level: 3
      - name: Linux native Slint GUI smoke in Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run --manifest-path tools/ui-bench/slint-rust-host/Cargo.toml --locked -- --smoke

      # Downloadable developer previews are created only after all native QA gates.
      # These are temporary Actions artifacts; no GitHub Release or user install.
      - name: Linux native resize and compact/expanded navigation QA
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run --manifest-path tools/ui-bench/slint-rust-host/Cargo.toml --locked -- --qa-resize
      - name: Build and verify macOS portable ZIP
        if: runner.os == 'macOS' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          host="tools/ui-bench/slint-rust-host"
          app="$host/dist/ChallengerHubNativePreview.app"
          stage="$host/dist/ci-download"
          mkdir -p "$stage"
          platform="macos-$(uname -m)"
          filename="$(node "$host/portable-artifact.mjs" name "$platform")"
          archive="$stage/$filename"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          verified="$RUNNER_TEMP/portable-macos-extract"
          mkdir -p "$verified"
          /usr/bin/ditto -x -k "$archive" "$verified"
          /usr/bin/codesign --verify --deep --strict "$verified/ChallengerHubNativePreview.app"
          "$verified/ChallengerHubNativePreview.app/Contents/MacOS/challenger-slint-rust-host" --check-backend-only
          node "$host/portable-artifact.mjs" write "$platform" "$archive"
      - name: Build and verify Windows release-mode portable ZIP
        if: runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        env:
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SLINT_BACKEND: winit-software
        run: |
          $hostDir = 'tools/ui-bench/slint-rust-host'
          & "./$hostDir/package-windows.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Release-mode Windows native packaging failed' }
          $platform = 'windows-x64'
          $fileName = (& node "$hostDir/portable-artifact.mjs" name $platform | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or !($fileName -match '^ChallengerHubNativePreview-v')) { throw 'Portable filename invalid' }
          $stage = Join-Path $hostDir 'dist/ci-download'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $archive = Join-Path $stage $fileName
          Compress-Archive -Path "$hostDir/dist/ChallengerHubNativePreview-Win" -DestinationPath $archive -CompressionLevel Optimal
          $verifyDir = Join-Path $env:RUNNER_TEMP 'portable-windows-extract'
          Expand-Archive -Path $archive -DestinationPath $verifyDir -Force
          $exe = Join-Path $verifyDir 'ChallengerHubNativePreview-Win/challenger-slint-rust-host.exe'
          $bundledNode = Join-Path $verifyDir 'ChallengerHubNativePreview-Win/resources/node.exe'
          $license = Join-Path $verifyDir 'ChallengerHubNativePreview-Win/resources/NODE_LICENSE.txt'
          if (!(Test-Path $exe) -or !(Test-Path $license) -or (& $bundledNode --version) -ne 'v24.22.1') {
            throw 'Extracted Windows portable bundle is incomplete'
          }
          & $exe --check-backend-only
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Windows bundled backend failed' }
          & $exe --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Windows release GUI smoke failed' }
          & $exe --qa-resize
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Windows release resize QA failed' }
          & node "$hostDir/portable-artifact.mjs" write $platform $archive
          if ($LASTEXITCODE -ne 0) { throw 'Windows portable metadata failed' }
      - name: Attest portable ZIP source and build provenance (no publisher signing)
        if: runner.os != 'Linux' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest@v4
        with:
          subject-path: tools/ui-bench/slint-rust-host/dist/ci-download/*.zip
      - name: Save portable preview for 7 days (no public Release)
        if: runner.os != 'Linux' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: challenger-native-portable-${{ runner.os }}-${{ github.run_id }}
          path: tools/ui-bench/slint-rust-host/dist/ci-download/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
