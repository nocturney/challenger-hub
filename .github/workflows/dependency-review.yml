name: Dependency Review (manual)
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Trusted comparison baseline (branch or SHA)'
        required: true
        default: main
        type: string
      head_ref:
        description: 'Branch or SHA to examine'
        required: true
        type: string
permissions:
  contents: read
jobs:
  review:
    if: inputs.base_ref != inputs.head_ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.head_ref }}
      - name: Review changes between explicitly selected refs
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ inputs.base_ref }}
          head-ref: ${{ inputs.head_ref }}
          fail-on-severity: high
