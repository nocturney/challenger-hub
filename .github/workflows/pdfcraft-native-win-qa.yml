name: PdfCraft Native Windows installation QA
on:
  pull_request:
    paths:
      - ".github/workflows/pdfcraft-native-win-qa.yml"
      - "Install-Challenger.js"
      - "portable-assets.json"
      - "tools/ui-bench/slint-node-bridge/install-bridge.mjs"
      - "tools/ui-bench/slint-node-bridge/install-bridge.test.mjs"
      - "tools/ui-bench/slint-node-bridge/windows-install-sandbox.ps1"
  workflow_dispatch:
# A newer PR commit supersedes older CI; manual QA runs are never auto-canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  pdfcraft-native-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate Windows package PowerShell syntax before Rust compilation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/ui-bench/slint-rust-host/package-windows.ps1').Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ("Packaging PowerShell syntax: " + (($parseErrors | ForEach-Object { $_.Message }) -join "; ")) }
      - name: Build isolated Preview12 runtime
        run: node tools/desktop-build/build-runtime.cjs 12
      - name: Test strict PdfCraft source and approval policy
        run: node --test tools/ui-bench/slint-node-bridge/install-bridge.test.mjs
      - name: Build native Windows Slint host
        run: cargo build --manifest-path tools/ui-bench/slint-rust-host/Cargo.toml --locked
      - name: Build standalone developer preview
        shell: pwsh
        run: |
          ./tools/ui-bench/slint-rust-host/package-windows.ps1 -DebugBuild
          $node = "./tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/resources/node.exe"
          $notice = "./tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/resources/NODE_LICENSE.txt"
          if (!(Test-Path $notice) -or (Get-Item $notice).Length -lt 150000) { throw "Node license missing from QA package" }
          if ((& $node --version) -ne "v24.22.1" -or $LASTEXITCODE -ne 0) { throw "Unpatched Node in QA package" }
          $exe = "./tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/challenger-slint-rust-host.exe"
          $env:SLINT_BACKEND = "winit-software"
          & $exe --smoke
          if ($LASTEXITCODE -ne 0) { throw "Packaged native GUI smoke failed" }
      - name: Real portable install test in disposable runner only
        shell: pwsh
        run: ./tools/ui-bench/slint-node-bridge/windows-install-sandbox.ps1
      - name: Upload temporary Windows preview for approved Chris Session 1 QA
        uses: actions/upload-artifact@v4
        with:
          name: challenger-pdfcraft-native-win-preview
          path: tools/ui-bench/slint-rust-host/dist/ChallengerHubNativePreview-Win/
          retention-days: 1
          compression-level: 3
          if-no-files-found: error
